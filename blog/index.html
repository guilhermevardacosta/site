<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- 1. Configurações Base -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 2. SEO Principal (Google) -->
    <title>Blog Literário | Guilherme Vardacosta</title>
    <meta name="description" content="Artigos, ensaios literários, ordens de leitura e reflexões sobre a escrita de ficção fantástica por Guilherme Vardacosta.">
    <meta name="author" content="Guilherme Vardacosta">
    <meta name="robots" content="index, follow">

    <!-- 3. URL Canônica -->
    <link rel="canonical" href="https://guilhermevardacosta.com.br/blog/">

    <!-- 4. Open Graph (Redes Sociais) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://guilhermevardacosta.com.br/blog/">
    <meta property="og:title" content="Blog Literário | Guilherme Vardacosta">
    <meta property="og:description" content="Artigos, ensaios literários, ordens de leitura e reflexões sobre a escrita de ficção fantástica por Guilherme Vardacosta.">
    <meta property="og:image" content="https://guilhermevardacosta.com.br/capa-social.jpg">

    <!-- 5. Ícone da aba -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖋️</text></svg>">

    <!-- 6. Pré-conexões de Tipografia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 7. Scripts Síncronos -->
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('tema-preferido') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));</script>

    <!-- 8. Estilos Globais -->
    <link rel="stylesheet" href="/style.css">

    <!-- 9. Scripts Assíncronos -->
    <script src="/components.js" defer></script>
    <script src="/posts.js" defer></script>
</head>

<body>

    <site-header></site-header>

    <main class="container page-content">
        <header class="page-header">
            <span class="badge-tag">Ensaios & Crítica</span>
            <h1>Crônicas do Ofício</h1>
            <p class="page-subtitle">Reflexões sobre estrutura de narrativa fantástica, worldbuilding e leituras aprofundadas.</p>
        </header>

        <!-- Grade de Artigos Dinâmica -->
        <section id="blog-feed" class="blog-feed"></section>
       
    </main>

    <site-footer></site-footer>

</body>

</html>
